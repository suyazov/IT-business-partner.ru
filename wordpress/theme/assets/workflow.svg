16" rx="5" fill="#f6f5ef"/><text x="73" y="354" font-size="10" fill="#68715e" letter-spacing="1">03 / ИСПОЛНЕНИЕ</text><text x="73" y="384" font-size="19" fill="#253025">Задача команде</text><text x="73" y="416" font-size="11" fill="#68715e">Кто делает и к какому сроку</text><text x="344" y="354" font-size="10" fill="#68715e" letter-spacing="1">04 / КОНТРОЛЬ</text><text x="344" y="384" font-size="19" fill="#253025">Видимый статус</text><text x="344" y="416" font-size="11" fill="#68715e">Что сделано и что дальше</text><path d="M301 385h19" stroke="#a7bc8f" marker-end="url(#a)"/><path d="M312 329H177" stroke="#a7bc8f"/><path d="M177 321v8" stroke="#a7bc8f"/><rect x="52" y="478" width="520" height="47" rx="4" stroke="#5b6b51"/><path d="m70 501 5 5 9-11" stroke="#d7edaa" stroke-width="1.7"/><text x="98" y="507" font-size="12" fill="#d7e0cd">Проверяем весь путь, а не отдельную настройку</text></g></svg>
