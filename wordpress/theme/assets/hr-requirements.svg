<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Подготовка ТЗ для кадрового процесса</title>
  <desc id="desc">Схема аналитического пакета: исходная анкета CRM, правила переноса, кадровый процесс. Иллюстрация не содержит клиентских полей или данных.</desc>
  <rect width="1200" height="900" fill="#e8edf2"/>
  <g font-family="Arial, sans-serif" fill="#192c3a">
    <text x="64" y="78" font-size="20" letter-spacing="3">БИЗНЕС-АНАЛИЗ / ТРЕБОВАНИЯ</text>
    <text x="64" y="164" font-size="65" letter-spacing="-3">От анкеты к ТЗ</text>
    <text x="66" y="210" font-size="24" fill="#536572">Подготовка кадровой интеграции к разработке</text>
    <path d="M260 382h680" stroke="#a6b8c5" stroke-width="4"/>
    <rect x="64" y="284" width="330" height="196" rx="18" fill="#fff"/>
    <rect x="434" y="284" width="330" height="196" rx="18" fill="#173f56"/>
    <rect x="804" y="284" width="330" height="196" rx="18" fill="#fff"/>
    <text x="92" y="329" font-size="17" fill="#687c89">ИСТОЧНИК</text><text x="92" y="390" font-size="29">Анкета CRM</text><text x="92" y="435" font-size="20" fill="#536572">Поля и значения</text>
    <text x="462" y="329" font-size="17" fill="#a9c6d5">ПРАВИЛА</text><text x="462" y="390" font-size="29" fill="#fff">Техническое ТЗ</text><text x="462" y="435" font-size="20" fill="#c0d8e5">Сопоставление данных</text>
    <text x="832" y="329" font-size="17" fill="#687c89">ПОЛУЧАТЕЛЬ</text><text x="832" y="390" font-size="27">Кадровый процесс</text><text x="832" y="435" font-size="20" fill="#536572">Ожидаемое поведение</text>
    <rect x="64" y="524" width="1070" height="240" rx="18" fill="#fff"/>
    <text x="94" y="571" font-size="17" fill="#687c89" letter-spacing="2">ЧТО НУЖНО ОПРЕДЕЛИТЬ ДО РАЗРАБОТКИ</text>
    <g font-size="26">
      <text x="94" y="638">Поля</text><text x="357" y="638">Статусы</text><text x="621" y="638">Права</text><text x="886" y="638">Ошибки</text>
    </g>
    <g font-size="17" fill="#536572">
      <text x="94" y="684">Источник истины</text><text x="357" y="684">Правила переходов</text><text x="621" y="684">Границы доступа</text><text x="886" y="684">Неоднозначности</text>
    </g>
  </g>
</svg>
