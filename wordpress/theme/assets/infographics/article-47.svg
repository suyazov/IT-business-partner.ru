<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1692" viewBox="0 0 1440 1692" role="img" aria-labelledby="title description"><title id="title">Разница между шагом сетки и допустимой длительностью</title><desc id="description">Сохранять корректное расписание при удобном масштабе календаря</desc><rect width="1440" height="1692" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Разница между шагом сетки и допустимой</tspan><tspan x="68" dy="66">длительностью</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Сохранять корректное расписание при удобном масштабе календаря</tspan></text><rect x="68" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Отображение</tspan></text><text x="98" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Пользователь выбирает удобный масштаб</tspan><tspan x="98" dy="32">времени</tspan></text><rect x="730" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Услуга</tspan></text><text x="760" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Система подставляет согласованную</tspan><tspan x="760" dy="32">длительность</tspan></text><rect x="68" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Интервал</tspan></text><text x="98" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Уточняются начало, конец и подготовка</tspan></text><rect x="730" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Проверка</tspan></text><text x="760" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Применяются ограничения рабочего дня и</tspan><tspan x="760" dy="32">пересечений</tspan></text><rect x="68" y="897" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сохранение</tspan></text><text x="98" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Записывается точное время без скрытого</tspan><tspan x="98" dy="32">округления</tspan></text><rect x="730" y="897" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Повтор</tspan></text><text x="760" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Запись читается в другом масштабе календаря</tspan></text><rect x="68" y="1154" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1212" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Услуга длиннее шага сетки?</tspan></text><text x="102" y="1283" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1327" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Занят весь реальный интервал</tspan></text><text x="747" y="1283" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1327" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Применяются ограничения рабочего дня и</tspan><tspan x="747" dy="32">пересечений</tspan></text><text x="68" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">владелец услуги</tspan></text><text x="508" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Запись читается в другом</tspan><tspan x="508" dy="31">масштабе календаря</tspan></text><text x="948" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">доля записей с корректной</tspan><tspan x="948" dy="31">длительностью и число ручных</tspan><tspan x="948" dy="31">исправлений после округления</tspan></text><text x="68" y="1638" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
