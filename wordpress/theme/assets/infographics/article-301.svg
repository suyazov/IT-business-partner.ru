<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1799" viewBox="0 0 1440 1799" role="img" aria-labelledby="title description"><title id="title">Паспорт сайта на Beget: артефакты, которые остаются владельцу после проекта</title><desc id="description">Паспорт отражает действующее решение и помогает следующему исполнителю работать самостоятельно.</desc><rect width="1440" height="1799" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Паспорт сайта на Beget: артефакты, которые</tspan><tspan x="68" dy="66">остаются владельцу после проекта</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Паспорт отражает действующее решение и помогает следующему исполнителю</tspan><tspan x="68" dy="35">работать самостоятельно.</tspan></text><rect x="68" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Определить назначение</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Назвать критичные клиентские маршруты,</tspan><tspan x="98" dy="32">владельца результата и ограничения.</tspan></text><rect x="730" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Собрать карту сервисов</tspan></text><text x="760" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Подтвердить среды, размещение, приложение и</tspan><tspan x="760" dy="32">внешние зависимости.</tspan></text><rect x="68" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Зафиксировать источники и роли</tspan></text><text x="98" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Указать принятую версию, редактируемые</tspan><tspan x="98" dy="32">данные и безопасную карту доступов.</tspan></text><rect x="730" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Описать переходы данных</tspan></text><text x="760" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Назначить источники правды, повторные</tspan><tspan x="760" dy="32">попытки и владельцев исключений.</tspan></text><rect x="68" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Приложить доказательства</tspan></text><text x="98" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Связать утверждения с контрольными</tspan><tspan x="98" dy="32">сценариями, временем и покрытием.</tspan></text><rect x="730" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Принять передачу</tspan></text><text x="760" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить одну реальную задачу по документу</tspan><tspan x="760" dy="32">и назначить обновление паспорта.</tspan></text><rect x="68" y="1189" width="1292" height="278" rx="22" fill="#242a25"/><text x="102" y="1247" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">По паспорту можно найти актуальное решение и выполнить</tspan><tspan x="102" dy="41">согласованную проверку?</tspan></text><text x="102" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Принимаем передачу и сохраняем одного</tspan><tspan x="102" dy="32">владельца актуальности документа.</tspan></text><text x="747" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Заполняем конкретный разрыв вместо</tspan><tspan x="747" dy="32">создания ещё одной противоречащей версии.</tspan></text><text x="68" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Владелец проекта и</tspan><tspan x="68" dy="31">назначенный ответственный за</tspan><tspan x="68" dy="31">эксплуатационный контекст</tspan></text><text x="508" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Карта сервисов, принятая</tspan><tspan x="508" dy="31">поставка, матрица ролей и</tspan><tspan x="508" dy="31">результаты контрольных</tspan><tspan x="508" dy="31">сценариев</tspan></text><text x="948" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Число критичных зависимостей</tspan><tspan x="948" dy="31">без подтверждённого</tspan><tspan x="948" dy="31">владельца и актуального</tspan><tspan x="948" dy="31">описания</tspan></text><text x="68" y="1745" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
