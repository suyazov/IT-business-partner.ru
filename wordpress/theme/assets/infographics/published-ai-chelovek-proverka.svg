<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1667" viewBox="0 0 1440 1667" role="img" aria-labelledby="title description"><title id="title">Человек принимает конкретный результат</title><desc id="description">Контроль связывает версию, полномочие и действие</desc><rect width="1440" height="1667" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Человек принимает конкретный результат</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Контроль связывает версию, полномочие и действие</tspan></text><rect x="68" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Подготовить предложение</tspan></text><text x="98" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Отделить черновик от исполнения с</tspan><tspan x="98" dy="32">последствиями.</tspan></text><rect x="730" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Показать основания</tspan></text><text x="760" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Исходник, существенные условия и</tspan><tspan x="760" dy="32">предлагаемые изменения.</tspan></text><rect x="68" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Получить решение</tspan></text><text x="98" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Принять, исправить, отклонить или запросить</tspan><tspan x="98" dy="32">уточнение.</tspan></text><rect x="730" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Проверить актуальность</tspan></text><text x="760" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Версия, объект, адресат и полномочия не</tspan><tspan x="760" dy="32">изменились.</tspan></text><rect x="68" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Выполнить разрешённое</tspan></text><text x="98" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Только согласованный набор действий и</tspan><tspan x="98" dy="32">данных.</tspan></text><rect x="730" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Подтвердить результат</tspan></text><text x="760" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Различить одобрение, выполнение и</tspan><tspan x="760" dy="32">неопределённость.</tspan></text><rect x="68" y="1088" width="1292" height="278" rx="22" fill="#242a25"/><text x="102" y="1146" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Есть полномочное решение по актуальной версии и достаточным</tspan><tspan x="102" dy="41">основаниям?</tspan></text><text x="102" y="1258" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1302" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Выполнить разрешённое действие и проверить</tspan><tspan x="102" dy="32">результат.</tspan></text><text x="747" y="1258" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1302" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Вернуть на уточнение или необходимую</tspan><tspan x="747" dy="32">проверку без внешнего действия.</tspan></text><text x="68" y="1410" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1454" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Уполномоченный проверяющий и</tspan><tspan x="68" dy="31">владелец процесса</tspan></text><text x="508" y="1410" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1454" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Версия предложения,</tspan><tspan x="508" dy="31">основание, решение и</tspan><tspan x="508" dy="31">фактический результат</tspan></text><text x="948" y="1410" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1454" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Существенные ошибки,</tspan><tspan x="948" dy="31">обнаруженные до действия, и</tspan><tspan x="948" dy="31">трудоёмкость проверки</tspan></text><text x="68" y="1613" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
