<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1702" viewBox="0 0 1440 1702" role="img" aria-labelledby="title description"><title id="title">От серверного письма к рабочей программе</title><desc id="description">Найденное в Webmail сообщение позволяет локализовать проверку без случайной смены DNS</desc><rect width="1440" height="1702" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">От серверного письма к рабочей программе</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Найденное в Webmail сообщение позволяет локализовать проверку без случайной</tspan><tspan x="68" dy="35">смены DNS</tspan></text><rect x="68" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сообщение</tspan></text><text x="98" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Найти безопасный конкретный ориентир в</tspan><tspan x="98" dy="32">нужном ящике</tspan></text><rect x="730" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Идентичность</tspan></text><text x="760" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Сверить фактические аккаунт и сервер</tspan><tspan x="760" dy="32">клиента</tspan></text><rect x="68" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Соединение</tspan></text><text x="98" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить новый обмен, а не видимость</tspan><tspan x="98" dy="32">старого архива</tspan></text><rect x="730" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Представление</tspan></text><text x="760" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Разобрать папки, фильтры и загрузку</tspan><tspan x="760" dy="32">содержания</tspan></text><rect x="68" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сохранность</tspan></text><text x="98" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Учесть локальные материалы до изменения</tspan><tspan x="98" dy="32">профиля</tspan></text><rect x="730" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Приёмка</tspan></text><text x="760" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Прочитать новое письмо и пройти рабочий</tspan><tspan x="760" dy="32">ответ</tspan></text><rect x="68" y="1123" width="1292" height="278" rx="22" fill="#242a25"/><text x="102" y="1181" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Подтверждены тот же серверный ящик и действующее подключение</tspan><tspan x="102" dy="41">клиента?</tspan></text><text x="102" y="1293" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1337" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Локализовать папку, фильтр или загрузку</tspan><tspan x="102" dy="32">конкретного сообщения</tspan></text><text x="747" y="1293" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1337" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Исправить точную настройку доступа с</tspan><tspan x="747" dy="32">сохранением локальной работы</tspan></text><text x="68" y="1445" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1489" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Почтовый администратор и</tspan><tspan x="68" dy="31">специалист рабочего места</tspan></text><text x="508" y="1445" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1489" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Новое контрольное сообщение</tspan><tspan x="508" dy="31">на сервере и в программе</tspan></text><text x="948" y="1445" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1489" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Рабочие сообщения,</tspan><tspan x="948" dy="31">недоступные в согласованном</tspan><tspan x="948" dy="31">клиентском маршруте</tspan></text><text x="68" y="1648" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
