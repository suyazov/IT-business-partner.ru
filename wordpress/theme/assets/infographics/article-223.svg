<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1661" viewBox="0 0 1440 1661" role="img" aria-labelledby="title description"><title id="title">Продление по подтверждённому результату</title><desc id="description">Оплата и включённая автоматика не заменяют проверку состояния конкретного домена</desc><rect width="1440" height="1661" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Продление по подтверждённому результату</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Оплата и включённая автоматика не заменяют проверку состояния конкретного</tspan><tspan x="68" dy="35">домена</tspan></text><rect x="68" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Карта</tspan></text><text x="98" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Установить домен, обслуживание, срок и</tspan><tspan x="98" dy="32">зависимые сервисы</tspan></text><rect x="730" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Владелец</tspan></text><text x="760" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Назначить ответственного и подтвердить</tspan><tspan x="760" dy="32">доступ</tspan></text><rect x="68" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Основание</tspan></text><text x="98" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Согласовать необходимость и источник оплаты</tspan></text><rect x="730" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Действие</tspan></text><text x="760" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Выполнить ручной либо проверить</tspan><tspan x="760" dy="32">автоматический путь</tspan></text><rect x="68" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Результат</tspan></text><text x="98" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Подтвердить новый срок и исключения</tspan></text><rect x="730" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Цикл</tspan></text><text x="760" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Обновить реестр и доступный канал</tspan><tspan x="760" dy="32">следующего контроля</tspan></text><rect x="68" y="1123" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1181" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Подтверждён ли факт продления конкретной услуги?</tspan></text><text x="102" y="1252" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1296" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Завершить цикл и назначить следующий</tspan><tspan x="102" dy="32">контроль</tspan></text><text x="747" y="1252" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1296" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Разобрать оплату, доступ или состояние у</tspan><tspan x="747" dy="32">ответственного владельца</tspan></text><text x="68" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Доменный ответственный и</tspan><tspan x="68" dy="31">владелец бюджета</tspan></text><text x="508" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Актуальное состояние услуги</tspan><tspan x="508" dy="31">и безопасная карта</tspan><tspan x="508" dy="31">обязательств</tspan></text><text x="948" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Домены с неподтверждённым</tspan><tspan x="948" dy="31">продлением или неясным</tspan><tspan x="948" dy="31">владельцем</tspan></text><text x="68" y="1607" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
