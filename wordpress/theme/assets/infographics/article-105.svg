<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1727" viewBox="0 0 1440 1727" role="img" aria-labelledby="title description"><title id="title">Noindex: от причины исключения к проверенному ответу</title><desc id="description">Правило индексации должно соответствовать судьбе материала и доступности роботу</desc><rect width="1440" height="1727" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Noindex: от причины исключения к</tspan><tspan x="68" dy="66">проверенному ответу</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Правило индексации должно соответствовать судьбе материала и доступности</tspan><tspan x="68" dy="35">роботу</tspan></text><rect x="68" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Причина</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Определить, остаётся ли материал публично</tspan><tspan x="98" dy="32">доступным</tspan></text><rect x="730" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600