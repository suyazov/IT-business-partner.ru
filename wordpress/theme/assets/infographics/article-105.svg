fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Приёмка</tspan></text><text x="98" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Сравнить исключаемый URL и соседний</tspan><tspan x="98" dy="32">публичный материал</tspan></text><rect x="730" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Наблюдение</tspan></text><text x="760" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Отделить исправленную настройку от</tspan><tspan x="760" dy="32">последующей обработки поиска</tspan></text><rect x="68" y="1189" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1247" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Робот может получить ответ с новым указанием?</tspan></text><text x="102" y="1318" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1362" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Подтвердить настройку и наблюдать</tspan><tspan x="102" dy="32">повторную обработку</tspan></text><text x="747" y="1318" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-seri