<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1629" viewBox="0 0 1440 1629" role="img" aria-labelledby="title description"><title id="title">Очередь разбора бюджетных исключений</title><desc id="description">Превратить существенное отклонение в действие с владельцем и проверенным завершением</desc><rect width="1440" height="1629" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Очередь разбора бюджетных исключений</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Превратить существенное отклонение в действие с владельцем и проверенным</tspan><tspan x="68" dy="35">завершением</tspan></text><rect x="68" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сравнение</tspan></text><text x="98" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Выявлено расхождение по согласованному</tspan><tspan x="98" dy="32">правилу</tspan></text><rect x="730" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Классификация</tspan></text><text x="760" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Определена ошибка данных или деловое</tspan><tspan x="760" dy="32">отклонение</tspan></text><rect x="68" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Назначение</tspan></text><text x="98" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Задача передана владельцу причины</tspan></text><rect x="730" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Разбор</tspan></text><text x="760" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Собраны основания и выбран допустимый</tspan><tspan x="760" dy="32">вариант</tspan></text><rect x="68" y="866" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Решение</tspan></text><text x="98" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Исправление или согласование зафиксировано</tspan></text><rect x="730" y="866" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Контроль</tspan></text><text x="760" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Повторная сверка подтвердила завершение</tspan></text><rect x="68" y="1091" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1149" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Отклонение вызвано дублем?</tspan></text><text x="102" y="1220" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1264" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Исправлены данные с сохранением основания</tspan></text><text x="747" y="1220" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1264" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Собраны основания и выбран допустимый</tspan><tspan x="747" dy="32">вариант</tspan></text><text x="68" y="1372" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1416" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">владелец бюджетного контроля</tspan></text><text x="508" y="1372" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1416" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Повторная сверка подтвердила</tspan><tspan x="508" dy="31">завершение</tspan></text><text x="948" y="1372" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1416" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">возраст открытых исключений</tspan><tspan x="948" dy="31">и доля повторных расхождений</tspan><tspan x="948" dy="31">по уже разобранной причине</tspan></text><text x="68" y="1575" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
