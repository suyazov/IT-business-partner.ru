<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1626" viewBox="0 0 1440 1626" role="img" aria-labelledby="title description"><title id="title">Услуга связана с проектом и документом</title><desc id="description">Сверяем назначение, период и решение об использовании</desc><rect width="1440" height="1626" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Услуга связана с проектом и документом</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Сверяем назначение, период и решение об использовании</tspan></text><rect x="68" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Инвентарь</tspan></text><text x="98" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Получить перечень используемых услуг и их</tspan><tspan x="98" dy="32">владельцев</tspan></text><rect x="730" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Назначение</tspan></text><text x="760" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Связать ресурс с проектом и работающим</tspan><tspan x="760" dy="32">процессом</tspan></text><rect x="68" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сверка</tspan></text><text x="98" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Сопоставить период услуги, платёж и</tspan><tspan x="98" dy="32">доступный документ</tspan></text><rect x="730" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Исключение</tspan></text><text x="760" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Разобрать неизвестный ресурс, период или</tspan><tspan x="760" dy="32">плательщика</tspan></text><rect x="68" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Решение</tspan></text><text x="98" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Подтвердить продолжение либо подготовить</tspan><tspan x="98" dy="32">отдельное завершение</tspan></text><rect x="730" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Учёт</tspan></text><text x="760" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Передать принятые сведения ответственным и</tspan><tspan x="760" dy="32">обновить реестр</tspan></text><rect x="68" y="1088" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1146" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Расход найден, а назначение услуги не подтверждено?</tspan></text><text x="102" y="1217" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1261" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Установить владельца и использование до</tspan><tspan x="102" dy="32">изменения оплаты или ресурса</tspan></text><text x="747" y="1217" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1261" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Проверить период, документ и действующее</tspan><tspan x="747" dy="32">решение проекта</tspan></text><text x="68" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Координатор инфраструктуры и</tspan><tspan x="68" dy="31">ответственный за оплату</tspan></text><text x="508" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Реестр услуг с проектом,</tspan><tspan x="508" dy="31">периодом и ссылкой на</tspan><tspan x="508" dy="31">документ</tspan></text><text x="948" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Услуги без назначения и</tspan><tspan x="948" dy="31">неразобранные расхождения</tspan><tspan x="948" dy="31">сверки</tspan></text><text x="68" y="1572" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
