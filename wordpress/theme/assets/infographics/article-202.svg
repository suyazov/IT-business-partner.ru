<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1725" viewBox="0 0 1440 1725" role="img" aria-labelledby="title description"><title id="title">От обращения до проверенного резюме в CRM</title><desc id="description">Исходная заявка сохраняется независимо от доступности ИИ; рабочие поля изменяются после проверки</desc><rect width="1440" height="1725" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">От обращения до проверенного резюме в CRM</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Исходная заявка сохраняется независимо от доступности ИИ; рабочие поля</tspan><tspan x="68" dy="35">изменяются после проверки</tspan></text><rect x="68" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сохранить обращение</tspan></text><text x="98" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Сервер принимает форму и фиксирует заявку с</tspan><tspan x="98" dy="32">собственным идентификатором.</tspan></text><rect x="730" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Проверить полномочия</tspan></text><text x="760" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Обработчик отбирает разрешённые поля и</tspan><tspan x="760" dy="32">связывает их с доступной CRM-карточкой.</tspan></text><rect x="68" y="609" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Создать задание</tspan></text><text x="98" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Очередь получает ключ операции и версию</tspan><tspan x="98" dy="32">инструкции; повтор не размножает работу.</tspan></text><rect x="730" y="609" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Получить черновик</tspan></text><text x="760" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Серверный адаптер вызывает шлюз в</tspan><tspan x="760" dy="32">согласованном формате с лимитами времени и</tspan><tspan x="760" dy="32">бюджета.</tspan></text><rect x="68" y="898" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="926" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="961" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1023" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Проверить контракт</tspan></text><text x="98" y="1072" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Приложение проверяет структуру,</tspan><tspan x="98" dy="32">справочники, отсутствие выдуманных</tspan><tspan x="98" dy="32">обязательных полей.</tspan></text><rect x="730" y="898" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="926" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="961" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1023" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Передать менеджеру</tspan></text><text x="760" y="1072" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Сотрудник видит исходник рядом с резюме и</tspan><tspan x="760" dy="32">подтверждает либо исправляет результат.</tspan></text><rect x="68" y="1187" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1245" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Ответ прошёл технические и предметные проверки?</tspan></text><text x="102" y="1316" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1360" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Сохранить один черновик в нужной карточке</tspan><tspan x="102" dy="32">и предложить сотруднику проверку.</tspan></text><text x="747" y="1316" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1360" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Сохранить исходную заявку, обозначить</tspan><tspan x="747" dy="32">причину и назначить ручной разбор.</tspan></text><text x="68" y="1468" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1512" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Владелец CRM-сценария и</tspan><tspan x="68" dy="31">ответственный за интеграцию</tspan></text><text x="508" y="1468" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1512" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Идентификаторы заявки и</tspan><tspan x="508" dy="31">задания, версия инструкции,</tspan><tspan x="508" dy="31">протокол приёмочных примеров</tspan></text><text x="948" y="1468" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1512" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Стоимость принятого резюме</tspan><tspan x="948" dy="31">вместе со временем проверки</tspan><tspan x="948" dy="31">и долей ручного разбора</tspan></text><text x="68" y="1671" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
