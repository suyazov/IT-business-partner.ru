<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1692" viewBox="0 0 1440 1692" role="img" aria-labelledby="title description"><title id="title">Mixed content: исправить источник HTTP-ресурса</title><desc id="description">От действия пользователя до устойчивой защищённой зависимости</desc><rect width="1440" height="1692" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Mixed content: исправить источник</tspan><tspan x="68" dy="66">HTTP-ресурса</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">От действия пользователя до устойчивой защищённой зависимости</tspan></text><rect x="68" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Вызвать</tspan></text><text x="98" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Повторить действие, которое загружает</tspan><tspan x="98" dy="32">проблемный ресурс</tspan></text><rect x="730" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Найти</tspan></text><text x="760" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Определить тип запроса и его инициатор в</tspan><tspan x="760" dy="32">браузере</tspan></text><rect x="68" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Проверить</tspan></text><text x="98" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Установить существование корректной</tspan><tspan x="98" dy="32">HTTPS-замены</tspan></text><rect x="730" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Исправить</tspan></text><text x="760" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Изменить поле, шаблон или конфигурацию</tspan><tspan x="760" dy="32">исходного компонента</tspan></text><rect x="68" y="897" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Обновить</tspan></text><text x="98" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Пересобрать или очистить зависимые</tspan><tspan x="98" dy="32">представления предусмотренным способом</tspan></text><rect x="730" y="897" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Принять</tspan></text><text x="760" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить функцию, другой материал и</tspan><tspan x="760" dy="32">мобильные состояния</tspan></text><rect x="68" y="1154" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1212" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Внешний ресурс поддерживает корректную защищённую точку?</tspan></text><text x="102" y="1283" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1327" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Обновить источник адреса и повторить</tspan><tspan x="102" dy="32">сценарий</tspan></text><text x="747" y="1283" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1327" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Согласовать замену зависимости или</tspan><tspan x="747" dy="32">изменение функции</tspan></text><text x="68" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Разработчик компонента и</tspan><tspan x="68" dy="31">владелец страницы</tspan></text><text x="508" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Сетевые запросы и успешное</tspan><tspan x="508" dy="31">исходное действие без обхода</tspan><tspan x="508" dy="31">TLS</tspan></text><text x="948" y="1435" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1479" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Число небезопасных</tspan><tspan x="948" dy="31">встраиваемых запросов в</tspan><tspan x="948" dy="31">контрольных сценариях</tspan></text><text x="68" y="1638" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
