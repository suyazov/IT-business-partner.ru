<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1768" viewBox="0 0 1440 1768" role="img" aria-labelledby="title description"><title id="title">Идемпотентность: сохранить смысл одной операции</title><desc id="description">Технические повторы не должны создавать новые потребности или скрывать самостоятельные</desc><rect width="1440" height="1768" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Идемпотентность: сохранить смысл одной</tspan><tspan x="68" dy="66">операции</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Технические повторы не должны создавать новые потребности или скрывать</tspan><tspan x="68" dy="35">самостоятельные</tspan></text><rect x="68" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Граница</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Определить новую потребность и технический</tspan><tspan x="98" dy="32">повтор</tspan></text><rect x="730" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Ключ</tspan></text><text x="760" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Создать идентичность до первой попытки и</tspan><tspan x="760" dy="32">сохранить для продолжений</tspan></text><rect x="68" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Состояние</tspan></text><text x="98" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Связать ключ, параметры и известный</tspan><tspan x="98" dy="32">результат</tspan></text><rect x="730" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Атомарность</tspan></text><text x="760" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Защитить приём от конкурентных запросов</tspan></text><rect x="68" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Внешний эффект</tspan></text><text x="98" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить API-контракт и неизвестные</tspan><tspan x="98" dy="32">результаты</tspan></text><rect x="730" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Испытание</tspan></text><text x="760" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Повторить последовательность,</tspan><tspan x="760" dy="32">одновременность и перезапуск</tspan></text><rect x="68" y="1189" width="1292" height="278" rx="22" fill="#242a25"/><text x="102" y="1247" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Предыдущая внешняя запись могла завершиться без полученного</tspan><tspan x="102" dy="41">ответа?</tspan></text><text x="102" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Сначала сверить фактическое состояние и не</tspan><tspan x="102" dy="32">создавать объект вслепую</tspan></text><text x="747" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Продолжить по принятому контракту и</tspan><tspan x="747" dy="32">сохранённому ключу</tspan></text><text x="68" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Разработчик обработчика и</tspan><tspan x="68" dy="31">владелец операции</tspan></text><text x="508" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Число бизнес-объектов и</tspan><tspan x="508" dy="31">состояния запросов при</tspan><tspan x="508" dy="31">контролируемых повторах</tspan></text><text x="948" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Количество неожиданных</tspan><tspan x="948" dy="31">дублей и потерянных</tspan><tspan x="948" dy="31">самостоятельных обращений</tspan></text><text x="68" y="1714" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
