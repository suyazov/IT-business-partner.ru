<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1984" viewBox="0 0 1440 1984" role="img" aria-labelledby="title description"><title id="title">Адрес прежний — состояние проверяется заново</title><desc id="description">Плавающий IPv4 меняет точку назначения, а приложение требует отдельного переноса</desc><rect width="1440" height="1984" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Адрес прежний — состояние проверяется</tspan><tspan x="68" dy="66">заново</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Плавающий IPv4 меняет точку назначения, а приложение требует отдельного</tspan><tspan x="68" dy="35">переноса</tspan></text><rect x="68" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Область</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Подтвердить адрес, серверы и допустимую</tspan><tspan x="98" dy="32">локацию</tspan></text><rect x="730" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Готовность</tspan></text><text x="760" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить поставку, конфигурацию и</tspan><tspan x="760" dy="32">зависимости нового узла</tspan></text><rect x="68" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Данные</tspan></text><text x="98" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Зафиксировать границу переноса и последние</tspan><tspan x="98" dy="32">принятые операции</tspan></text><rect x="730" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Исполнители</tspan></text><text x="760" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Определить единственное рабочее назначение</tspan><tspan x="760" dy="32">очередей и расписаний</tspan></text><rect x="68" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Переключение</tspan></text><text x="98" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Применить точное разрешённое изменение</tspan><tspan x="98" dy="32">адреса</tspan></text><rect x="730" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Приёмка</tspan></text><text x="760" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить пользовательский маршрут, обмен и</tspan><tspan x="760" dy="32">незавершённые задачи</tspan></text><rect x="68" y="1189" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="1217" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="1252" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">07</tspan></text><text x="98" y="1314" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Завершение</tspan></text><text x="98" y="1363" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Принять новое размещение и отдельно решить</tspan><tspan x="98" dy="32">судьбу прежнего</tspan></text><rect x="68" y="1446" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1504" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">После переключения появились новые данные на целевом сервере?</tspan></text><text x="102" y="1575" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1619" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Возврат адреса оценивать вместе с</tspan><tspan x="102" dy="32">согласованностью этих изменений</tspan></text><text x="747" y="1575" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1619" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Проверить фактическое состояние и</tspan><tspan x="747" dy="32">допустимый план продолжения</tspan></text><text x="68" y="1727" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1771" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Координатор переноса и</tspan><tspan x="68" dy="31">владелец данных сервиса</tspan></text><text x="508" y="1727" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1771" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Карта состояния, граница</tspan><tspan x="508" dy="31">операций и протокол приёмки</tspan><tspan x="508" dy="31">после смены адреса</tspan></text><text x="948" y="1727" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1771" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Неучтённые операции и</tspan><tspan x="948" dy="31">повторные эффекты на границе</tspan><tspan x="948" dy="31">переноса</tspan></text><text x="68" y="1930" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
