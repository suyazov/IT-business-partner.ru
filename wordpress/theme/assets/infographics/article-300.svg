<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1861" viewBox="0 0 1440 1861" role="img" aria-labelledby="title description"><title id="title">Хостинг, разработчик и интегратор: кто отвечает за какой сбой</title><desc id="description">Участники подтверждают свои факты, координатор связывает их с результатом бизнеса.</desc><rect width="1440" height="1861" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Хостинг, разработчик и интегратор: кто</tspan><tspan x="68" dy="66">отвечает за какой сбой</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Участники подтверждают свои факты, координатор связывает их с результатом</tspan><tspan x="68" dy="35">бизнеса.</tspan></text><rect x="68" y="418" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Зафиксировать влияние</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Описать нарушенное действие, масштаб и</tspan><tspan x="98" dy="32">временной интервал без преждевременного</tspan><tspan x="98" dy="32">диагноза.</tspan></text><rect x="730" y="418" width="630" height="265" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Назначить координатора</tspan></text><text x="760" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Установить владельца общего хода инцидента</tspan><tspan x="760" dy="32">и исполнителей участков.</tspan></text><rect x="68" y="707" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="735" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="770" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="832" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Найти границу подтверждения</tspan></text><text x="98" y="881" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Связать последний проверенный факт с</tspan><tspan x="98" dy="32">ближайшим непроверенным переходом.</tspan></text><rect x="730" y="707" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="735" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="770" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="832" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Передать точный эпизод</tspan></text><text x="760" y="881" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Дать ответственному безопасный ID,</tspan><tspan x="760" dy="32">ожидание, наблюдение и нужный вопрос.</tspan></text><rect x="68" y="964" width="630" height="272" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="992" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="1027" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1089" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Выполнить согласованное</tspan><tspan x="98" dy="39">изменение</tspan></text><text x="98" y="1177" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Изменить доказанный участок одним</tspan><tspan x="98" dy="32">назначенным исполнителем.</tspan></text><rect x="730" y="964" width="630" height="272" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="992" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="1027" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1089" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Принять итог и последствия</tspan></text><text x="760" y="1138" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить сквозной сценарий, пропуски,</tspan><tspan x="760" dy="32">повторы и остающиеся ограничения.</tspan></text><rect x="68" y="1260" width="1292" height="269" rx="22" fill="#242a25"/><text x="102" y="1318" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Восстановлен согласованный маршрут и разобраны последствия сбоя?</tspan></text><text x="102" y="1389" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1433" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Владелец процесса принимает итог;</tspan><tspan x="102" dy="32">фиксируем результат и актуальную</tspan><tspan x="102" dy="32">поддержку.</tspan></text><text x="747" y="1389" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1433" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Назначаем конкретный непройденный переход</tspan><tspan x="747" dy="32">или сверку незавершённых объектов.</tspan></text><text x="68" y="1573" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1617" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Координатор инцидента и</tspan><tspan x="68" dy="31">владельцы затронутых</tspan><tspan x="68" dy="31">бизнесовых маршрутов</tspan></text><text x="508" y="1573" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1617" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Временная линия, факты</tspan><tspan x="508" dy="31">участников, изменение и</tspan><tspan x="508" dy="31">сквозной контрольный</tspan><tspan x="508" dy="31">результат</tspan></text><text x="948" y="1573" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1617" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Число инцидентов без</tspan><tspan x="948" dy="31">назначенного следующего</tspan><tspan x="948" dy="31">действия и подтверждённого</tspan><tspan x="948" dy="31">итога</tspan></text><text x="68" y="1807" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
