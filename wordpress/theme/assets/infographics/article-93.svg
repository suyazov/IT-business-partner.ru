<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1564" viewBox="0 0 1440 1564" role="img" aria-labelledby="title description"><title id="title">Порядок автоматизации по бизнесовым критериям</title><desc id="description">Выбрать первый этап на сопоставимых основаниях</desc><rect width="1440" height="1564" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Порядок автоматизации по бизнесовым</tspan><tspan x="68" dy="66">критериям</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Выбрать первый этап на сопоставимых основаниях</tspan></text><rect x="68" y="383" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Кандидаты</tspan></text><text x="98" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Собрать повторяющиеся проблемы процессов</tspan></text><rect x="730" y="383" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Факты</tspan></text><text x="760" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Измерить частоту, труд и последствия ошибок</tspan></text><rect x="68" y="608" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="636" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="671" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="733" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Готовность</tspan></text><text x="98" y="782" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить правила, данные и владельцев</tspan></text><rect x="730" y="608" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="636" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="671" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="733" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Сравнение</tspan></text><text x="760" y="782" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Применить одну согласованную шкалу</tspan></text><rect x="68" y="833" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="861" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="896" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="958" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Выбор</tspan></text><text x="98" y="1007" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Ограничить законченный первый этап</tspan></text><rect x="730" y="833" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="861" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="896" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="958" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Обратная связь</tspan></text><text x="760" y="1007" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Пересмотреть очередь после пилота</tspan></text><rect x="68" y="1058" width="1292" height="205" rx="22" fill="#242a25"/><text x="102" y="1116" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Достаточно ли данных и согласованных правил?</tspan></text><text x="102" y="1187" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1231" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Подготовить приёмку выбранного этапа</tspan></text><text x="747" y="1187" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1231" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Применить одну согласованную шкалу</tspan></text><text x="68" y="1307" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1351" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">владелец программы изменений</tspan></text><text x="508" y="1307" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1351" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Пересмотреть очередь после</tspan><tspan x="508" dy="31">пилота</tspan></text><text x="948" y="1307" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1351" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">время до полезного</tspan><tspan x="948" dy="31">результата и число</tspan><tspan x="948" dy="31">нерешённых зависимостей</tspan></text><text x="68" y="1510" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
