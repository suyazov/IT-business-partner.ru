<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1594" viewBox="0 0 1440 1594" role="img" aria-labelledby="title description"><title id="title">От источника картинки до карточки товара</title><desc id="description">Перенос хранения проверяется вместе со штатным обменом</desc><rect width="1440" height="1594" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">От источника картинки до карточки товара</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Перенос хранения проверяется вместе со штатным обменом</tspan></text><rect x="68" y="317" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Правило</tspan></text><text x="98" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Источник, назначение, замена и удаление.</tspan></text><rect x="730" y="317" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Ключ</tspan></text><text x="760" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Связать товар, вариант и изображение.</tspan></text><rect x="68" y="542" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="570" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="605" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="667" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Пилот</tspan></text><text x="98" y="716" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Простая карточка, галерея и ручная правка.</tspan></text><rect x="730" y="542" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="570" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="605" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="667" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Обмен</tspan></text><text x="760" y="716" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Проверить получение и сопоставление</tspan><tspan x="760" dy="32">материала.</tspan></text><rect x="68" y="799" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="827" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="862" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="924" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Вывод</tspan></text><text x="98" y="973" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Список, карточка и применимые варианты.</tspan></text><rect x="730" y="799" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="827" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="862" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="924" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Повтор</tspan></text><text x="760" y="973" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Замена, неизменённый пакет и передача</tspan><tspan x="760" dy="32">исключений.</tspan></text><rect x="68" y="1056" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1114" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Следующий штатный обмен сохраняет правильный каталог?</tspan></text><text x="102" y="1185" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1229" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Принять хранение и правила сопровождения.</tspan></text><text x="747" y="1185" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1229" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Исправить контракт обновления, связь или</tspan><tspan x="747" dy="32">выдачу.</tspan></text><text x="68" y="1337" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1381" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Владелец каталога совместно</tspan><tspan x="68" dy="31">с подрядчиком обмена</tspan></text><text x="508" y="1337" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1381" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Паспорта изображений и</tspan><tspan x="508" dy="31">матрица приёмки товаров</tspan></text><text x="948" y="1337" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1381" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Неверные связи, потери</tspan><tspan x="948" dy="31">галереи и возврат старых</tspan><tspan x="948" dy="31">изображений</tspan></text><text x="68" y="1540" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
