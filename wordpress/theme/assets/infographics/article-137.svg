<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1661" viewBox="0 0 1440 1661" role="img" aria-labelledby="title description"><title id="title">Изображение: смысл, размер и загрузка</title><desc id="description">Уменьшение файла полезно только при сохранённом назначении визуального материала</desc><rect width="1440" height="1661" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Изображение: смысл, размер и загрузка</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Уменьшение файла полезно только при сохранённом назначении визуального</tspan><tspan x="68" dy="35">материала</tspan></text><rect x="68" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Назначение</tspan></text><text x="98" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Определить, что человек должен увидеть</tspan></text><rect x="730" y="352" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="380" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="415" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="477" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Ресурс</tspan></text><text x="760" y="526" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Сравнить видимый блок и реальный сетевой</tspan><tspan x="760" dy="32">запрос</tspan></text><rect x="68" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Подготовка</tspan></text><text x="98" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Выбрать кадр, формат и нужные размеры</tspan></text><rect x="730" y="609" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="637" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="672" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="734" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Загрузка</tspan></text><text x="760" y="783" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Согласовать главное изображение и глубокие</tspan><tspan x="760" dy="32">материалы</tspan></text><rect x="68" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Приёмка</tspan></text><text x="98" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить читаемость, выбор браузера и</tspan><tspan x="98" dy="32">стабильность</tspan></text><rect x="730" y="866" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="894" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="929" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="991" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Наполнение</tspan></text><text x="760" y="1040" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Дать редактору поддерживаемый способ</tspan><tspan x="760" dy="32">следующей публикации</tspan></text><rect x="68" y="1123" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1181" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Изображение сохранило смысл в реальном размере?</tspan></text><text x="102" y="1252" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1296" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Сверить передаваемые данные и момент</tspan><tspan x="102" dy="32">загрузки</tspan></text><text x="747" y="1252" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1296" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Изменить композицию или качество вместо</tspan><tspan x="747" dy="32">дальнейшего сжатия</tspan></text><text x="68" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Редактор визуальных</tspan><tspan x="68" dy="31">материалов и разработчик</tspan><tspan x="68" dy="31">шаблона</tspan></text><text x="508" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Контрольные изображения в</tspan><tspan x="508" dy="31">карточке, подробном и</tspan><tspan x="508" dy="31">мобильном представлении</tspan></text><text x="948" y="1404" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1448" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Объём реально переданных</tspan><tspan x="948" dy="31">данных при принятом качестве</tspan></text><text x="68" y="1607" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
