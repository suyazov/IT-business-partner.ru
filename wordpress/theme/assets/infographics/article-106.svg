<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1595" viewBox="0 0 1440 1595" role="img" aria-labelledby="title description"><title id="title">Canonical: согласовать основной адрес</title><desc id="description">Сначала назначение страниц, затем тег и остальные сигналы структуры</desc><rect width="1440" height="1595" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Canonical: согласовать основной адрес</tspan></text><text x="68" y="240" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Сначала назначение страниц, затем тег и остальные сигналы структуры</tspan></text><rect x="68" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Сравнить</tspan></text><text x="98" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить содержание и действия у вариантов</tspan><tspan x="98" dy="32">URL</tspan></text><rect x="730" y="317" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="345" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="380" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="442" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Решить</tspan></text><text x="760" y="491" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Определить дубли и самостоятельные полезные</tspan><tspan x="760" dy="32">страницы</tspan></text><rect x="68" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Выбрать</tspan></text><text x="98" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Назначить доступный окончательный основной</tspan><tspan x="98" dy="32">адрес</tspan></text><rect x="730" y="574" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="602" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="637" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="699" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Согласовать</tspan></text><text x="760" y="748" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Сверить canonical, меню, карту и</tspan><tspan x="760" dy="32">перенаправления</tspan></text><rect x="68" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Испытать</tspan></text><text x="98" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить параметры, пагинацию и новый</tspan><tspan x="98" dy="32">материал</tspan></text><rect x="730" y="831" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="859" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="894" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="956" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Наблюдать</tspan></text><text x="760" y="1005" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Отделить технические сигналы от решения</tspan><tspan x="760" dy="32">поисковой системы</tspan></text><rect x="68" y="1088" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1146" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Варианты действительно решают одну задачу одинаковым содержанием?</tspan></text><text x="102" y="1217" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1261" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Согласовать предпочтительный адрес и</tspan><tspan x="102" dy="32">управляемые ссылки</tspan></text><text x="747" y="1217" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1261" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Сохранить самостоятельное назначение или</tspan><tspan x="747" dy="32">принять редакторское объединение</tspan></text><text x="68" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Ответственный за структуру и</tspan><tspan x="68" dy="31">владелец раздела</tspan></text><text x="508" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Набор URL с опубликованными</tspan><tspan x="508" dy="31">тегами и объяснением выбора</tspan></text><text x="948" y="1369" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1413" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Число конфликтующих указаний</tspan><tspan x="948" dy="31">в согласованной выборке</tspan></text><text x="68" y="1541" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
