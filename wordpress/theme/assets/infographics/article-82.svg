<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1691" viewBox="0 0 1440 1691" role="img" aria-labelledby="title description"><title id="title">Разделение движения денег и управленческого результата</title><desc id="description">Отвечать на разные вопросы отдельными согласованными отчётами</desc><rect width="1440" height="1691" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">Разделение движения денег и</tspan><tspan x="68" dy="66">управленческого результата</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Отвечать на разные вопросы отдельными согласованными отчётами</tspan></text><rect x="68" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Вопрос</tspan></text><text x="98" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Определено, какой показатель нужен</tspan><tspan x="98" dy="32">руководителю</tspan></text><rect x="730" y="383" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="411" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="446" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="508" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Источники</tspan></text><text x="760" y="557" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Разделены деньги и операционные основания</tspan></text><rect x="68" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Связи</tspan></text><text x="98" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Сопоставлены относящиеся к одному</tspan><tspan x="98" dy="32">обязательству события</tspan></text><rect x="730" y="640" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="668" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="703" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="765" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Период</tspan></text><text x="760" y="814" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Применено согласованное правило времени</tspan></text><rect x="68" y="897" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Отчёт</tspan></text><text x="98" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Построены отдельные представления</tspan></text><rect x="730" y="897" width="630" height="201" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="925" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="960" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1022" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Сверка</tspan></text><text x="760" y="1071" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Объяснены различия между итогами</tspan></text><rect x="68" y="1122" width="1292" height="237" rx="22" fill="#242a25"/><text x="102" y="1180" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Получен аванс?</tspan></text><text x="102" y="1251" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1295" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Его смысл не подменён названием</tspan><tspan x="102" dy="32">поступления</tspan></text><text x="747" y="1251" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1295" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Применено согласованное правило времени</tspan></text><text x="68" y="1403" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1447" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">владелец управленческой</tspan><tspan x="68" dy="31">модели</tspan></text><text x="508" y="1403" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1447" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Объяснены различия между</tspan><tspan x="508" dy="31">итогами</tspan></text><text x="948" y="1403" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1447" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">количество необъяснённых</tspan><tspan x="948" dy="31">расхождений между отчётами и</tspan><tspan x="948" dy="31">полнота связей с первичными</tspan><tspan x="948" dy="31">событиями</tspan></text><text x="68" y="1637" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
