<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1799" viewBox="0 0 1440 1799" role="img" aria-labelledby="title description"><title id="title">От узкого участка к обоснованной отдельной базе</title><desc id="description">Разделение ресурсов принимается по целевому процессу, совместимости и сохранности данных</desc><rect width="1440" height="1799" fill="#f3f5ee"/><text x="68" y="86" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600"><tspan x="68" dy="0">СУТРИ / КАРТА ПРОЦЕССА</tspan></text><text x="68" y="166" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600"><tspan x="68" dy="0">От узкого участка к обоснованной отдельной</tspan><tspan x="68" dy="66">базе</tspan></text><text x="68" y="306" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="68" dy="0">Разделение ресурсов принимается по целевому процессу, совместимости и</tspan><tspan x="68" dy="35">сохранности данных</tspan></text><rect x="68" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">01</tspan></text><text x="98" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Измерение</tspan></text><text x="98" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Выделить медленную операцию и фактическое</tspan><tspan x="98" dy="32">время её частей</tspan></text><rect x="730" y="418" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="446" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="481" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">02</tspan></text><text x="760" y="543" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Причина</tspan></text><text x="760" y="592" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Различить запрос, повторные обращения и</tspan><tspan x="760" dy="32">конкуренцию ресурсов</tspan></text><rect x="68" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">03</tspan></text><text x="98" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Схема</tspan></text><text x="98" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Проверить сеть, версию и владельцев</tspan><tspan x="98" dy="32">сопровождения</tspan></text><rect x="730" y="675" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="703" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="738" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">04</tspan></text><text x="760" y="800" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Сравнение</tspan></text><text x="760" y="849" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Испытать целевой маршрут на сопоставимых</tspan><tspan x="760" dy="32">условиях</tspan></text><rect x="68" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="98" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="111" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="111" dy="0">05</tspan></text><text x="98" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="98" dy="0">Перенос</tspan></text><text x="98" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Сохранить один источник новых записей и</tspan><tspan x="98" dy="32">проверить всех потребителей</tspan></text><rect x="730" y="932" width="630" height="233" rx="22" fill="#ffffff" stroke="#d8dfd0"/><rect x="760" y="960" width="66" height="52" rx="26" fill="#d8f58a"/><text x="773" y="995" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="773" dy="0">06</tspan></text><text x="760" y="1057" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600"><tspan x="760" dy="0">Приёмка</tspan></text><text x="760" y="1106" fill="#4f5c51" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="760" dy="0">Подтвердить новые данные, измеренный эффект</tspan><tspan x="760" dy="32">и восстановление</tspan></text><rect x="68" y="1189" width="1292" height="278" rx="22" fill="#242a25"/><text x="102" y="1247" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600"><tspan x="102" dy="0">Отдельный контур решает подтверждённую задачу при допустимых новых</tspan><tspan x="102" dy="41">зависимостях?</tspan></text><text x="102" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="102" dy="0">УСЛОВИЕ ВЫПОЛНЕНО</tspan></text><text x="102" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="102" dy="0">Переходить по согласованной схеме и</tspan><tspan x="102" dy="32">целевой приёмке</tspan></text><text x="747" y="1359" fill="#d8f58a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="747" dy="0">ТРЕБУЕТ ДОРАБОТКИ</tspan></text><text x="747" y="1403" fill="#edf2e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400"><tspan x="747" dy="0">Исправить локальный узкий участок либо</tspan><tspan x="747" dy="32">уточнить основание</tspan></text><text x="68" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">ОТВЕТСТВЕННЫЙ</tspan></text><text x="68" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="68" dy="0">Владелец сайта, разработчик</tspan><tspan x="68" dy="31">и специалист базы</tspan></text><text x="508" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="508" dy="0">ПОДТВЕРЖДЕНИЕ</tspan></text><text x="508" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="508" dy="0">Измеренный маршрут, карта</tspan><tspan x="508" dy="31">потребителей и сверка данных</tspan><tspan x="508" dy="31">перехода</tspan></text><text x="948" y="1511" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="948" dy="0">ЧТО ИЗМЕРЯЕМ</tspan></text><text x="948" y="1555" fill="#202522" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400"><tspan x="948" dy="0">Время целевой операции и</tspan><tspan x="948" dy="31">новые записи с</tspan><tspan x="948" dy="31">неподтверждённым местом</tspan><tspan x="948" dy="31">хранения</tspan></text><text x="68" y="1745" fill="#59644f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400"><tspan x="68" dy="0">sy3.ru · Рабочая схема для обсуждения и проверки требований</tspan></text></svg>
