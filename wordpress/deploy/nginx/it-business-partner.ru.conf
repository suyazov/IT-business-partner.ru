server {
    server_name it-business-partner.ru www.it-business-partner.ru;

    access_log /var/log/nginx/it-business-partner.ru.access.log;
    error_log /var/log/nginx/it-business-partner.ru.error.log;

    root /var/www/itbp-wordpress;
    index index.php;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wp-config.php { return 404; }
    location = /wp-config-sample.php { return 404; }
    location ~* ^/wp-content/uploads/.*\.(?:php[0-9]?|phtml|phar)(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php-fpm-sy3-ru.sock;
        fastcgi_read_timeout 120;
    }
    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/it-business-partner.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/it-business-partner.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.it-business-partner.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = it-business-partner.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name it-business-partner.ru www.it-business-partner.ru;
    return 404; # managed by Certbot




}