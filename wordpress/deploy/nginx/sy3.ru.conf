server {
    listen 443 ssl;
    gzip on;
    include snippets/block-attacks.conf;
    ssl_certificate /etc/letsencrypt/live/sy3.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sy3.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_name sy3.ru www.sy3.ru;

    root /var/www/sy3-wordpress;
    index index.php index.html index.htm;

    # WordPress checks authentication for the current-user endpoint.
    # Keep the shared user-enumeration restriction for all other user routes.
    location = /wp-json/wp/v2/users/me {
        try_files $uri $uri/ /index.php?$args;
    }
    # The editor requests the author list with context=view. Require context=edit
    # at WordPress instead, so its list_users capability check protects the list.
    location = /wp-json/wp/v2/users {
        try_files $uri $uri/ /index.php?$args&context=edit;
    }

    # Logging
    access_log /var/log/nginx/sy3.ru.access.log;
    error_log /var/log/nginx/sy3.ru.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;


    location = /wp-config-sample.php { return 404; }
    location ~* ^/wp-content/uploads/.*\.(?:php[0-9]?|phtml|phar)(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php-fpm-sy3-ru.sock;
        fastcgi_read_timeout 120;
    }
    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

}

server {
    listen 80;
    server_name sy3.ru www.sy3.ru;
    return 301 https://$host$request_uri;
}
